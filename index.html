<!doctype html>
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery Viewer</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
	<script>
		document.documentElement.classList.add("pageLoading");
	</script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<div id="nav">
		<div id="navCont">
			<div id="searchCont">
				<input id="tagSearch" placeholder="Search tags...">
				<button id="clearSearch">×</button>
				<div id="tagSuggestions"></div>
			</div>
			<button id="searchButton">🔍</button>
			<h1 id="pageName">ImgBB Galleries</h1>
			<button id="saveButton" onclick="saveCurrentAlbum()" style="display:none;">
				💾
			</button>
			<button id="backButton" onclick="returnToAlbums()" style="display:none;">
				←
			</button>
		</div>
	</div>
	
	<div id="content">
		<div id="tagBar">
			<div id="tagControls">
				<button id="filterMode">Any</button>
				<button id="clearTags" style="display:none;">Clear</button>
			</div>
			<div id="tagList"></div>
		</div>

		<div id="gallery"></div>
	</div>
	
	<div id="modal" class="modal">
		<div id="modalImageContainer">
			<img id="modalImgSmall">
			<img id="modalImgMedium">
			<img id="modalImgFull">
		</div>
		<div id="zoomLevel">1.0x</div>
		<button id="modalFullButton" type="button" title="Switch Resolutions">
			🔍
		</button>
		<div id="modalLoading"></div>
		<div id="modalLoadingBar">
			<div id="modalLoadingProgress"></div>
		</div>
	</div>
	
	<div id="bottomBar">
		<button id="tagToggle" title="Show/Hide Tags">🏷</button>
	</div>
	<footer id="albumBottomControls">
		<button id="regenerateAlbum" title="Regenerate albums.js entry">↻</button>
	</footer>
</body>

<script type="module">

    const {
        Client,
        StorageIndexedDB
    } = await import(
        "https://esm.sh/@mtkruto/browser"
    );

    window.TelegramClient =
        Client;

    window.TelegramStorageIndexedDB =
        StorageIndexedDB;

    console.log(
        "[TELEGRAM] MTKruto loaded."
    );

    const moduleFiles = [
        "00-state-and-config.js",
        "01-album-routing-and-parsing.js",
        "02-albums-home-view.js",
        "03-temporary-albums-and-import-dialog.js",
        "04-telegram-import.js",
        "05-album-loading-and-render.js",
        "06-image-asset-sources.js",
        "07-thumbnail-loading-pipeline.js",
        "08-medium-loading-pipeline.js",
        "09-full-image-loader.js",
        "10-modal-viewer.js",
        "11-zoom-and-pan.js",
        "12-image-navigation-and-touch.js",
        "13-tag-filtering-and-gallery-layout.js",
        "14-xmp-metadata.js",
        "15-tag-search-and-suggestions.js",
        "16-tag-bar-state-and-center-return.js",
        "17-add-image-editor.js",
        "18-reload-albums-and-persistence.js",
        "19-album_editing.js",
        "20-view-transitions.js",
        "99-bootstrap.js"
    ];

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const script =
                document.createElement("script");

            script.src =
                "./modules/" + src;

            script.onload = resolve;
            script.onerror = () =>
                reject(new Error("Failed to load " + src));

            document.body.appendChild(
                script
            );
        });
    }

    for (const file of moduleFiles) {
        await loadScript(file);
    }

    console.log(
        "[GALLERY] All modules loaded."
    );

</script>
